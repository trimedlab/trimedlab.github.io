<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Cross with waveform -->
  <g transform="translate(10, 8)">
    <!-- Medical cross -->
    <rect x="12" y="0" width="8" height="36" rx="2" fill="url(#grad1)"/>
    <rect x="0" y="12" width="32" height="8" rx="2" fill="url(#grad1)"/>
    <!-- Waveform overlay -->
    <path d="M2 24 Q8 18 14 24 T28 24" stroke="#fff" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M4 28 Q10 22 16 28 T30 28" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="55" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="1">TriMed</text>
  <text x="55" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" letter-spacing="2">LABORATORY</text>
</svg>
